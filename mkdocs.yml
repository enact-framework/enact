site_name: Enact
site_description: Build Spring Boot applications around use cases defined in YAML.
site_url: https://enact-framework.github.io/enact/
repo_url: https://github.com/enact-framework/enact
repo_name: enact-framework/enact
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - assets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/enact-framework/enact
      name: GitHub
    - icon: simple/apachemaven
      link: https://central.sonatype.com/namespace/io.github.enact-framework
      name: Maven Central

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

exclude_docs: |
  step-discovery-guide.md

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
      - Steps: steps.md
      - Use cases: use-cases.md
      - Definition files: definition-files.md
      - Retry and cache: step-settings.md
      - HTTP trigger: http-trigger.md
      - Custom trigger: custom-trigger.md
      - Observability: observability.md
  - Roadmap: roadmap.md
