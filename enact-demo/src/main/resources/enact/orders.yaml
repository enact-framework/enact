# Use cases of the order domain. Picked up from `classpath:enact/`, see application.yaml.
use-cases:
  # The JSON body becomes the input (OrderRequest), no binding config needed
  createOrder:
    description: Validates and stores a new order
    trigger:
      rest:
        method: POST
        path: /api/v1/orders
        status: 201
    steps:
      - step: validateOrderCreation
      - step: saveOrder
        settings:
          retry:
            max-retries: 3
            delay: 100ms
      - step: mapOrderResponse

  # Query parameters bind to OrderSearch properties of the same name: ?minAmount=10&limit=5
  searchOrders:
    description: Lists orders above a minimum amount
    trigger:
      rest:
        method: GET
        path: /api/v1/orders
    steps:
      - step: searchOrders
      - step: mapOrderResponses

  # A single path variable binds straight to a scalar input: findOrder(id: UUID)
  findOrder:
    description: Looks up an order by id (cached)
    trigger:
      rest:
        method: GET
        path: /api/v1/orders/{id}
    steps:
      - step: findOrder       # cached via @Step(cache = Cached(...))
      - step: mapOrderResponse

  # `id` comes from the path by name; everything else is declared in `bind`
  updateOrder:
    description: Replaces an order's amount and product count
    group: authenticated
    trigger:
      rest:
        method: PUT
        path: /api/v1/orders/{id}
        filters: [auditUpdate]        # runs after the group's filters
        bind:
          updatedBy: attribute:userId   # set by the requireUser filter
          changes: body
    steps:
      - step: updateOrder
      - step: mapOrderResponse

  # A graph rather than a chain. `$input` is read twice, two edges meet in one step, one step is conditional
  # and one runs aside:
  #
  #   $input ┬─> loadOrder ───────┐
  #          └─> estimateShipping ┴─> quoteConfirmation ─> applyBulkDiscount ─> returned
  #                                                                         └─> notifyWarehouse (aside)
  confirmOrder:
    description: Quotes shipping for an order and discounts bulk purchases
    concurrent: true                  # loadOrder and estimateShipping read nothing of each other, so they run at once
    trigger:
      rest:
        method: POST
        path: /api/v1/orders/{id}/confirmation
    steps:
      - step: loadOrder
        in: $input                    # `id` binds from the path, `country` from a query parameter of the same name
      - step: estimateShipping
        in: $input                    # reads the use case input too, not the step declared above
      - step: quoteConfirmation
        in:                           # a step taking several parameters binds each of them by name
          order: $loadOrder
          shipping: $estimateShipping
      - step: applyBulkDiscount       # no `in`: a single parameter reads the step declared above
        when: "#confirmation.total >= 100"   # SpEL over the step's own inputs, named after its parameters
        else: $confirmation           # what the step yields when the condition does not hold
      - step: notifyWarehouse
        in: $applyBulkDiscount
        side: true                    # off the caller's thread, never waited for, and nothing may read it
      # applyBulkDiscount is returned: feeding a step that runs aside does not count as being read

  cancelOrder:
    description: Cancels an existing order
    trigger:
      rest:
        method: DELETE
        path: /api/v1/orders/{id}
        status: 204
    steps:
      - step: cancelOrder

# A group used by this domain only can live next to it
groups:
  authenticated:                # filters run in order: requestLog, then requireUser
    filters: [requestLog, requireUser]
