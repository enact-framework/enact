use-cases:
  generateId:
    description: Generates a random identifier
    group: public
    trigger:
      rest:
        method: GET
        path: /api/v1/generate-id
    steps:
      - step: generateRandomUUID

# Use cases in a group are wrapped by its filters (HandlerFilterFunction beans, see DemoFilters)
groups:
  default:                      # applies to every use case without a `group`
    filters: [requestLog]

  public:                       # opts out of the default group
    filters: []
    observability:
      enabled: false            # nothing in this group is measured
