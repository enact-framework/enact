spring:
  application:
    name: enact-demo
  cache:
    cache-names: orders
  mvc:
    problemdetails:
      enabled: true   # binding errors are answered as RFC 9457 problem details

management:
  endpoints:
    web:
      exposure:
        include: health, metrics
  metrics:
    distribution:
      percentiles:
        enact.use.case: 0.95, 0.99   # p95 and p99 per use case, see docs/observability.md

# Use cases and groups are defined in `src/main/resources/enact/`, the default location of definition files.
# Only Enact's own settings belong here; `enact.definitions` would point somewhere else.
