spring:
  application:
    name: enact-demo
  cache:
    cache-names: orders
  mvc:
    problemdetails:
      enabled: true   # binding errors are answered as RFC 9457 problem details

management:
  endpoints:
    web:
      exposure:
        include: health, metrics
  metrics:
    distribution:
      percentiles:
        enact.use.case: 0.95, 0.99   # p95 and p99 per use case, see docs/observability.md

enact:
  # Use cases are defined in `src/main/resources/enact/`, the default location of definition files.
  # Use cases in a group are wrapped by its filters (HandlerFilterFunction beans, see DemoFilters)
  groups:
    default:                      # applies to every use case without a `group`
      filters: [requestLog]
