name: snapshot

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md", "mkdocs.yml", ".github/workflows/docs.yml", ".github/workflows/release.yml"]

concurrency:
  group: snapshot
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      # VERSION_NAME in gradle.properties must end with -SNAPSHOT; releases come from tags (release.yml)
      - name: Check snapshot version
        run: grep -qE '^VERSION_NAME=.*-SNAPSHOT$' gradle.properties || { echo "VERSION_NAME is not a -SNAPSHOT version"; exit 1; }

      - name: Publish snapshot
        run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
